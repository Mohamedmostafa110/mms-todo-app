<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Almdrasa Notes - add, pin, search and delete notes. Everything is stored in your browser." />
    <title>Almdrasa Notes</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Federo&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app" id="app" data-view="home">
      <!-- Sidebar on desktop / slide-in menu on mobile -->
      <aside class="drawer" id="drawer" aria-label="Sidebar">
        <button class="icon-btn drawer__close" id="menuClose" type="button" aria-label="Close menu">
          <span data-icon="close"></span>
        </button>

        <a class="logo" href="#/">Almdrasa-Notes</a>

        <label class="search search--sidebar">
          <span class="search__icon" data-icon="search"></span>
          <input class="search__input" id="searchSidebar" type="search" placeholder="Search" autocomplete="off" aria-label="Search notes" />
        </label>

        <nav class="nav" aria-label="Primary">
          <a class="nav__link" href="#/" data-nav="home">Notes</a>
          <a class="nav__link" href="#/add" data-nav="add">Add Note</a>
        </nav>
      </aside>

      <div class="page" id="page">
        <!-- Mobile top bar -->
        <header class="topbar">
          <button class="icon-btn" id="menuOpen" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false">
            <span data-icon="menu"></span>
          </button>
          <a class="logo logo--center" href="#/">Almdrasa-Notes</a>
          <button class="icon-btn" id="searchToggle" type="button" aria-label="Toggle search" aria-controls="mobileSearch" aria-expanded="false">
            <span class="swap swap--off" data-icon="search"></span>
            <span class="swap swap--on" data-icon="close"></span>
          </button>
        </header>

        <div class="mobile-search" id="mobileSearch">
          <label class="search search--mobile">
            <span class="search__icon" data-icon="search"></span>
            <input class="search__input" id="searchMobile" type="search" placeholder="Search" autocomplete="off" aria-label="Search notes" />
          </label>
        </div>

        <div class="workspace">
          <section class="list-panel" id="listPanel" aria-label="Notes list">
            <button class="collapse-btn" id="collapseBtn" type="button" aria-label="Collapse notes list" aria-expanded="true">
              <span data-icon="chevronLeft"></span>
            </button>
            <div class="list-scroll" id="noteList"></div>
          </section>

          <main class="content" id="content"></main>
        </div>

        <a class="fab" href="#/add" aria-label="Add note">
          <span data-icon="plus"></span>
        </a>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
